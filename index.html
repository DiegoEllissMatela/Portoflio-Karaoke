<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Early PWA Install Prompt Capture -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
    </script>

    <!-- Theme & Color -->
    <meta name="theme-color" content="#6c3fc5" />

    <!-- Viewport — prevents zoom, enables full-screen on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS PWA full-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Karaoke" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- SEO / App description -->
    <meta name="description" content="Automate Karaoke — sing along with synchronized lyrics, scores, and a full song library. Works offline on Android and PC." />
    <meta name="application-name" content="Automate Karaoke" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Automate Karaoke</title>

    <!-- Ensure full-screen layout in standalone (installed) mode -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      @media (display-mode: standalone) {
        body {
          /* Safe area insets for notched phones */
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
