<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#050d1a" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="centerCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad2)" />
  <circle cx="200" cy="200" r="160" fill="url(#centerCyanGlow)" />

  <!-- Waveform Rings -->
  <circle cx="200" cy="200" r="135" stroke="url(#cyanBlue)" stroke-width="3" stroke-opacity="0.6" filter="url(#glow2)" />
  <circle cx="200" cy="200" r="110" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="85" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Center Card -->
  <rect x="145" y="145" width="110" height="110" rx="28" fill="url(#cyanBlue)" fill-opacity="0.15" stroke="url(#cyanBlue)" stroke-width="2" />

  <!-- Microphone Icon -->
  <g transform="translate(176, 172) scale(2)" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
    <line x1="12" y1="19" x2="12" y2="22" />
  </g>
</svg>