<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDef" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="50%" stop-color="#0c0714" />
      <stop offset="100%" stop-color="#050208" />
    </linearGradient>
    <linearGradient id="neonAll" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <radialGradient id="centerDefGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <filter id="glowDef" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgDef)" />
  <circle cx="200" cy="200" r="160" fill="url(#centerDefGlow)" />

  <circle cx="200" cy="200" r="140" stroke="url(#neonAll)" stroke-width="3" stroke-opacity="0.75" filter="url(#glowDef)" />
  <circle cx="200" cy="200" r="115" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="88" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Center Vinyl Badge -->
  <circle cx="200" cy="200" r="54" fill="url(#neonAll)" fill-opacity="0.22" stroke="url(#neonAll)" stroke-width="2" />
  <circle cx="200" cy="200" r="14" fill="#0c0714" stroke="url(#neonAll)" stroke-width="2" />

  <!-- Music Notes -->
  <g transform="translate(182, 172) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowDef)">
    <path d="M9 18V5l12-2v13" />
    <circle cx="6" cy="18" r="3" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="18" cy="16" r="3" fill="#ffffff" fill-opacity="0.9" />
  </g>
</svg>